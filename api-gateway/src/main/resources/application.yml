server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth
          uri: lb://AUTH-SERVICE
          predicates: [ "Path=/api/auth/**" ]
        - id: products
          uri: lb://PRODUCT-SERVICE
          predicates: [ "Path=/api/products/**" ]
        - id: orders
          uri: lb://ORDER-SERVICE
          predicates: [ "Path=/api/orders/**" ]
        - id: payments
          uri: lb://PAYMENT-SERVICE
          predicates: [ "Path=/api/payments/**" ]
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
jwt:
  secret: rr-products-secret-key-change-me-1234567890
